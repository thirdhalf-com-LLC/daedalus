name: daedalus-preprod-windows
on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Run the full build (otherwise plan/dry-run only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daedalus-preprod-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Daedalus 11.6.2
        uses: actions/checkout@v4
        with:
          repository: input-output-hk/daedalus
          ref: 11.6.2
          fetch-depth: 1

      - name: Report and reclaim disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/local/.ghcup /opt/az \
            /usr/local/share/powershell /usr/share/miniconda \
            /usr/local/go /usr/local/rustup /usr/local/cargo || true
          sudo apt-get clean
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            trusted-users = runner
            substituters = https://cache.iog.io https://cache.nixos.org/
            trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            allow-import-from-derivation = true

      - name: Plan (fetched vs built)
        run: |
          set -o pipefail
          nix build -L .#installer-x86_64-windows-preprod --dry-run 2>&1 | tee plan.log
          grep -E 'will be built|will be fetched' plan.log || true
          df -h /; du -sh /nix 2>/dev/null || true

      - name: Full build
        if: ${{ inputs.full_build }}
        run: nix build -L .#installer-x86_64-windows-preprod --out-link result

      - name: Stage artifact
        if: ${{ inputs.full_build }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -v result/*.exe artifact/
          ( cd artifact && sha256sum *.exe > SHA256SUMS )
          file artifact/*.exe
          ls -lh artifact/

      - name: Upload installer
        if: ${{ inputs.full_build }}
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-preprod-windows-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
