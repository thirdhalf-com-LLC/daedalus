name: daedalus-preprod-linux
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Packages to build
        type: choice
        options:
          - portable
          - rpm
          - deb
          - arch
          - all
        default: portable
      full_build:
        description: Run the full build (otherwise plan/dry-run only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daedalus-preprod-linux
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Daedalus 11.6.2
        uses: actions/checkout@v4
        with:
          repository: input-output-hk/daedalus
          ref: 11.6.2
          fetch-depth: 1

      - name: Report and reclaim disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/local/.ghcup /opt/az \
            /usr/local/share/powershell /usr/share/miniconda \
            /usr/local/go /usr/local/rustup /usr/local/cargo || true
          sudo apt-get clean
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            trusted-users = runner
            substituters = https://cache.iog.io https://cache.nixos.org/
            trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            allow-import-from-derivation = true

      - name: Plan (fetched vs built)
        run: |
          set -euo pipefail
          TARGETS="${{ inputs.targets }}"
          if [ "$TARGETS" = "all" ]; then TARGETS="portable rpm deb arch"; fi
          for t in $TARGETS; do
            case "$t" in
              portable) attr=".#installer-preprod" ;;
              rpm)      attr=".#rpm-installer-preprod" ;;
              deb)      attr=".#deb-installer-preprod" ;;
              arch)     attr=".#arch-installer-preprod" ;;
              *) echo "Unknown target: $t" >&2; exit 1 ;;
            esac
            echo "=== $t ($attr) ==="
            nix build -L "$attr" --dry-run 2>&1 | tee "plan-$t.log"
            grep -E 'will be built|will be fetched' "plan-$t.log" || true
          done
          df -h /; du -sh /nix 2>/dev/null || true

      - name: Full build
        if: ${{ inputs.full_build }}
        run: |
          set -euo pipefail
          TARGETS="${{ inputs.targets }}"
          if [ "$TARGETS" = "all" ]; then TARGETS="portable rpm deb arch"; fi
          for t in $TARGETS; do
            case "$t" in
              portable) attr=".#installer-preprod" ;;
              rpm)      attr=".#rpm-installer-preprod" ;;
              deb)      attr=".#deb-installer-preprod" ;;
              arch)     attr=".#arch-installer-preprod" ;;
              *) echo "Unknown target: $t" >&2; exit 1 ;;
            esac
            nix build -L "$attr" --out-link "result-$t"
          done

      - name: Stage artifact
        if: ${{ inputs.full_build }}
        run: |
          set -euo pipefail
          TARGETS="${{ inputs.targets }}"
          if [ "$TARGETS" = "all" ]; then TARGETS="portable rpm deb arch"; fi
          mkdir -p artifact
          for t in $TARGETS; do
            find -L "result-$t" -maxdepth 2 -type f \
              \( -name '*.bin' -o -name '*.rpm' -o -name '*.deb' -o -name '*.pkg.tar.zst' \) \
              -exec cp -v {} artifact/ \;
          done
          ( cd artifact && sha256sum * > SHA256SUMS )
          ls -lh artifact/

      - name: Upload packages
        if: ${{ inputs.full_build }}
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-preprod-linux-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
